name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/furama_cuisine_test
      APP_DATABASE_URL: postgres://postgres:postgres@localhost:5432/furama_cuisine_ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Prepare the app database
        run: node scripts/reset-db.mjs
        env:
          RESET_DATABASE_URL: ${{ env.APP_DATABASE_URL }}
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: ${{ env.APP_DATABASE_URL }}
      - name: Check the prerendered pages and the fonts
        run: node scripts/check-prerender.mjs
      - run: npx playwright install --with-deps chromium
      - name: End-to-end
        run: npm run test:e2e
        env:
          DATABASE_URL: ${{ env.APP_DATABASE_URL }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
